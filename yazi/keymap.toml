# ===== Manager =====

# Drop to shell: open a full shell session in the current directory
[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

# Smart enter: open file or enter directory in one key
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

# Smart paste: paste into hovered directory
[[mgr.prepend_keymap]]
on   = "P"
run  = "plugin smart-paste"
desc = "Paste into hovered directory"

# Smart tab: create tab and enter hovered directory
[[mgr.prepend_keymap]]
on   = ["t", "t"]
run  = "plugin smart-tab"
desc = "Create tab and enter hovered directory"

# Jump to char: vim-like f<char>
[[mgr.prepend_keymap]]
on   = "f"
run  = "plugin jump-to-char"
desc = "Jump to char"

# Smart filter
[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

# Toggle preview pane (maximize / restore)
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"

# Hide preview pane
[[mgr.prepend_keymap]]
on   = ["t", "h"]
run  = "plugin toggle-pane min-preview"
desc = "Hide or show preview"

# Parent directory navigation without leaving CWD
[[mgr.prepend_keymap]]
on   = "K"
run  = "plugin parent-arrow -1"
desc = "Navigate to previous parent directory"

[[mgr.prepend_keymap]]
on   = "J"
run  = "plugin parent-arrow 1"
desc = "Navigate to next parent directory"

# Diff selected file with hovered file
[[mgr.prepend_keymap]]
on   = ["d", "d"]
run  = "plugin diff"
desc = "Diff selected with hovered"

# Chmod on selected files
[[mgr.prepend_keymap]]
on   = ["c", "m"]
run  = "plugin chmod"
desc = "Chmod on selected files"

# cd to Git repository root
[[mgr.prepend_keymap]]
on   = ["g", "r"]
run  = 'shell --block -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "cd to Git repo root"

# Compress with ouch
[[mgr.prepend_keymap]]
on   = "C"
run  = "plugin ouch"
desc = "Compress with ouch"

# Confirm before quitting with multiple tabs
[[mgr.prepend_keymap]]
on   = "q"
run  = "plugin confirm-quit"
desc = "Confirm quit if multiple tabs open"

# ===== Input =====

# Close input by one Esc press (skip Vi mode)
[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"
